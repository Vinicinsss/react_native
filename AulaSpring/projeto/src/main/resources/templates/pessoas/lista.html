<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pessoas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1>Lista de Pessoas</h1>
        <a th:href="@{/web/pessoas/novo}" class="btn btn-primary">Nova Pessoa</a>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pessoas}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nome}"></td>
                    <td th:text="${p.idade}"></td>
                    <td>
                        <a th:href="@{/web/pessoas/detalhes/{id}(id=${p.id})}" class="btn">Ver</a>
                        <a th:href="@{/web/pessoas/editar/{id}(id=${p.id})}" class="btn">Editar</a>
                        <a th:href="@{/web/pessoas/deletar/{id}(id=${p.id})}" class="btn btn-danger"
                           onclick="return confirm('Deseja excluir esta pessoa?')">Excluir</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
