<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da Pessoa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1>Detalhes da Pessoa</h1>
        
        <div class="card">
            <p><strong>ID:</strong> <span th:text="${pessoa.id}"></span></p>
            <p><strong>Nome:</strong> <span th:text="${pessoa.nome}"></span></p>
            <p><strong>Idade:</strong> <span th:text="${pessoa.idade + ' anos'}"></span></p>
        </div>

        <div class="actions">
            <a th:href="@{/web/pessoas/editar/{id}(id=${pessoa.id})}" class="btn btn-primary">Editar</a>
            <a th:href="@{/web/pessoas}" class="btn">Voltar</a>
        </div>
    </div>
</body>
</html>
